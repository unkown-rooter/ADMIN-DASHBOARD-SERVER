<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Settings Panel</title>

    <link rel="stylesheet" href="/css/settings.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

<!-- =====================================================
     SETTINGS CONTAINER
===================================================== -->

<div class="settings-container">


    <!-- HEADER -->
    <header class="settings-header">

        <h1>

            <i class="fa-solid fa-gear"></i>

            SYSTEM SETTINGS

        </h1>

        <p>Configure bots, server and system behavior</p>

    </header>


    <!-- =====================================================
         SYSTEM STATUS
    ====================================================== -->

    <section class="status-grid">

        <div class="status-card">

            <h3>Server</h3>

            <p id="serverStatus">ONLINE</p>

        </div>

        <div class="status-card">

            <h3>MongoDB</h3>

            <p id="dbStatus">CONNECTED</p>

        </div>

        <div class="status-card">

            <h3>Active Bots</h3>

            <p id="activeBots">0</p>

        </div>

        <div class="status-card">

            <h3>Logs Level</h3>

            <p id="logLevel">INFO</p>

        </div>

    </section>


    <!-- =====================================================
         SETTINGS FORM
    ====================================================== -->

    <section class="settings-form">

        <!-- DEFAULT PREFIX -->
        <div class="form-group">

            <label>Default Prefix</label>

            <select id="defaultPrefix">

                <option value="/">/</option>

                <option value=".">.</option>

                <option value="!">!</option>

                <option value="?">?</option>

                <option value="#">#</option>

            </select>

        </div>


        <!-- LOG LEVEL -->
        <div class="form-group">

            <label>Log Level</label>

            <select id="logLevelSelect">

                <option value="info">INFO</option>

                <option value="debug">DEBUG</option>

                <option value="error">ERROR</option>

            </select>

        </div>


        <!-- API KEYS -->
        <div class="form-group">

            <label>Telegram Bot Token</label>

            <input type="text" id="telegramToken"
            placeholder="Enter token...">

        </div>


        <div class="form-group">

            <label>WhatsApp API Key</label>

            <input type="text" id="whatsappKey"
            placeholder="Enter API key...">

        </div>


        <!-- TOGGLES -->
        <div class="toggle-section">

            <div>

                <span>Auto Restart Server</span>

                <label class="switch">

                    <input type="checkbox" id="autoRestart">

                    <span class="slider"></span>

                </label>

            </div>


            <div>

                <span>Enable Logs</span>

                <label class="switch">

                    <input type="checkbox" id="enableLogs" checked>

                    <span class="slider"></span>

                </label>

            </div>

        </div>


        <!-- SAVE BUTTON -->
        <button id="saveSettingsBtn">

            <i class="fa-solid fa-floppy-disk"></i>

            Save Settings

        </button>

    </section>

</div>


<script src="js/settings.js"></script>

</body>

</html>
